# Render Blueprint — Prime Club
# Deploy: Render Dashboard > New > Blueprint > shu repo'ni tanlash
# Yoki:   https://dashboard.render.com/select-repo?type=blueprint
previewsEnabled: false

services:
  # PostgreSQL Database (free plan — 30 kundan keyin o'chmaydi, lekin bo'sh plan chegaralari bor)
  - type: pserv
    name: prime-club-db
    plan: free
    region: oregon

  # Backend API (24/7, auto-deploy GitHub push'dan)
  - type: web
    name: prime-club-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: prime-club-db
          property: connectionString
      - key: DB_DRIVER
        value: postgres
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_CODE_PEPPER
        generateValue: true
      - key: CORS_ORIGIN
        value: https://prime-nine-sage.vercel.app,https://prime-game-club.vercel.app
      # Demo hisoblar (+998901234567 / +998901111111 / +998900000000, parol: demo12345)
      # Dockerfile'da migrate + seed + start qilib beriladi (idempotent)
      - key: DEMO_SEED_ENABLED
        value: "true"
      - key: RUN_EXPIRATION_WORKER
        value: "true"
      # Telegram botni yoqish uchun quyidagini "true" qilib, TELEGRAM_BOT_TOKEN va
      # TELEGRAM_WEBHOOK_SECRET (generateValue) qo'shing. Aks holda servis ishga tushmaydi.
      - key: TELEGRAM_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_USERNAME
        value: primen1robot
      - key: TELEGRAM_MINI_APP_URL
        value: https://prime-nine-sage.vercel.app
    healthCheckPath: /health
    autoDeploy: true

  # Background Worker (session expiration)
  - type: worker
    name: prime-club-worker
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: node server/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: prime-club-db
          property: connectionString
      - key: DB_DRIVER
        value: postgres
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: JWT_SECRET
        fromService:
          name: prime-club-api
          property: envVars.JWT_SECRET
      - key: ACCESS_CODE_PEPPER
        fromService:
          name: prime-club-api
          property: envVars.ACCESS_CODE_PEPPER
    autoDeploy: true
