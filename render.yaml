services:
  # PostgreSQL Database
  - type: pserv
    name: prime-club-db
    plan: free
    region: oregon

  # Backend API
  - type: web
    name: prime-club-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: prime-club-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_CODE_PEPPER
        generateValue: true
      - key: CORS_ORIGIN
        value: https://prime-game-club.vercel.app
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: primen1robot
      - key: TELEGRAM_MINI_APP_URL
        value: https://prime-game-club.vercel.app
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_URL
        value: https://prime-club-api.onrender.com/api/v1/telegram/webhook
      - key: RUN_EXPIRATION_WORKER
        value: "true"
    healthCheckPath: /api/v1/health
    autoDeploy: true

  # Background Worker (for session expiration)
  - type: worker
    name: prime-club-worker
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: node server/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: prime-club-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        fromService:
          name: prime-club-api
          property: envVars.JWT_SECRET
      - key: ACCESS_CODE_PEPPER
        fromService:
          name: prime-club-api
          property: envVars.ACCESS_CODE_PEPPER
    autoDeploy: true

databases:
  - name: prime-club-db
    plan: free